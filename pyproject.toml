[project]
name = "voices"
version = "0.1.0"
description = "Nigtica — Nigerian STT/TTS demo — Flask UI x YarnGPT API (Yoruba, Igbo, Hausa, Pidgin, English)"
readme = "README.md"
authors = [
    { name = "OfficialDiLi", email = "yimmiy1389@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "groq>=1.7.0",
    "gunicorn>=26.2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
voices = "voices.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
