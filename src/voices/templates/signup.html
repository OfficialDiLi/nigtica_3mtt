<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up - Nigtica</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/plus-jakarta-sans@5.0.3/index.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container auth-page">
  <div class="card auth-card">
    <h1 class="card-title">Create your account</h1>
    <p class="card-subtitle">Sign up for Nigtica</p>
    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('signup_submit') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input type="text" id="email" name="email" inputmode="email" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password (min 8 characters)</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm">Confirm password</label>
        <input type="password" id="confirm" name="confirm" autocomplete="new-password" required minlength="8">
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%;">Sign up</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
</body>
</html>
